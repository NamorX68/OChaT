# 1) Build‐System
[build-system]
requires = ["setuptools>=61.0","wheel"]
build-backend = "setuptools.build_meta"

# 2) setuptools‐Konfiguration
[tool.setuptools]
packages = { find = { where = ["src"], include = ["ocht*"] } }

# 3) Projekt‐Metadaten
[project]
name = "ocht"
version = "0.1.1"
description = "Modulare Python-TUI zur Steuerung von LLMs via LangChain"
authors = [{ name = "Roman Thimian", email = "roman.thimian@me.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["tui", "langchain", "llm", "cli"]

dependencies = [
  "alembic>=1.15.2",
  "click>=8.3.3",
  # httpx/openai were previously only transitive (via langchain-openai/ollama); now imported
  # directly by adapters/resilience.py to classify retryable exceptions (httpx.TransportError,
  # openai.RateLimitError/APIConnectionError/etc.) - see CLAUDE.md "Error Recovery & Retry Logic".
  "httpx>=0.28,<1",
  "openai>=2.0,<3",
  # On the 1.x line - see CLAUDE.md "Dependency Upgrades" section for migration notes
  # (langchain.memory/.schema removed; ConversationSummaryMemory replaced with our own
  # summarization call in adapters/memory.py).
  "langchain>=1.0.0,<2",
  "langchain-anthropic>=1.0.0,<2",
  "langchain-core>=1.0.0,<2",
  "langchain-ollama>=1.0.0,<2",
  "langchain-openai>=1.0.0,<2",
  "langchain-text-splitters>=1.0.0,<2",
  # Only transitive via langchain-anthropic until adapters/resilience.py started importing it
  # directly for exception classification (anthropic.RateLimitError/APIConnectionError/etc.) -
  # same reasoning as the httpx/openai promotion above. See CLAUDE.md "Anthropic Adapter".
  # Capped below the current 1.x major deliberately, not as an oversight: is_retryable()'s
  # exception-class handling was verified against the 0.x line (0.125.0) specifically; bumping to
  # the 1.x major (which langchain-anthropic==1.7.0's own `<2.0.0` constraint would technically
  # allow) needs the same live verification against the installed package this project did for
  # 0.x before that ceiling is raised - see CLAUDE.md "Anthropic Adapter".
  "anthropic>=0.40,<1",
  "ollama>=0.4.8",
  "pyperclip>=1.8.2",
  "rich>=14.0.0",
  "sqlmodel>=0.0.24",
  "textual>=8.2.8",
]

# 4) CLI‐EntryPoint
[project.scripts]
ocht = "ocht.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.16.4",
]

# 5) UV‐Flag, damit es das Paket wirklich baut
[tool.uv]
package = true

# Floors for transitive dependencies that carry known CVEs, without pulling them into the
# direct dependency list (we don't import these packages ourselves - they come in via
# alembic/rich/langchain-*). See CLAUDE.md "Dependency Upgrades" section.
constraint-dependencies = [
    "langsmith>=0.8.18",
    "mako>=1.3.12",
    "pygments>=2.20.0",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
]

# 6) Ruff (Linting) - see CLAUDE.md "Linting" section for rationale
[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle/pyflakes core; I: import sorting; B: bugbear (common bug patterns);
# D: pydocstyle (Google-style docstring checks); UP: pyupgrade (modern syntax, e.g.
# Optional[X] -> X | None, List[str] -> list[str] - safe since requires-python >= 3.12).
select = ["E", "F", "I", "B", "D", "UP"]
ignore = [
    "D203",  # conflicts with D211 (no-blank-line-before-class vs one-blank-line-before-class)
    "D213",  # conflicts with D212 (multi-line-summary-second-line vs -first-line)
]

[tool.ruff.lint.pydocstyle]
convention = "google"
